[pytest]
markers =
    slow: long-running, full-dataset reproduction tests (opt-in; excluded by default, run explicitly with -m slow)
addopts = -p no:pytest-qt -m "not slow" --basetemp=.pytest_tmp

# --basetemp is pinned to a project-relative folder because on at least one
# dev machine in this project, some globally-installed site-packages code
# (observed: an ESTsoft-related tool) overrides `tempfile.tempdir` process-wide
# to a non-writable folder (`.../ESTsoft/CreatorTemp`) even though the TEMP/TMP
# environment variables themselves are correct -- this breaks every test using
# the `tmp_path` fixture with PermissionError unless basetemp is pinned
# explicitly.
